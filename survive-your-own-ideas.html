<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id),W=800,H=500,cv=$('cv'),c=cv.getContext('2d'),inp=$('idea');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),mul=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let S=1,OX=0,OY=0,dpr=1,G,me,remotes={},keys={},joy={x:0,y:0},running=false,peer,conns=[],isHost=false,myId='me',last=0;
function resize(){const st=$('stage'),w=st.clientWidth,h=st.clientHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=w*dpr;cv.height=h*dpr;S=Math.min(w/W,h/H);OX=(w-W*S)/2;OY=(h-H*S)/2}
addEventListener('resize',resize);new ResizeObserver(resize).observe($('stage'));

/* ---------- state helpers ---------- */
const setMod=(k,v,d)=>{G.mods[k]={v,u:G.t+d}},mod=(k,d)=>{const m=G.mods[k];return m&&m.u>G.t?m.v:d};
const R=()=>me.r*mod('size',1)*mod('hb',1);
const near=(x,y,r)=>Math.hypot(me.x-x,me.y-y)<r+R();
const hitRect=e=>{const cx=cl(me.x,e.x,e.x+e.w),cy=cl(me.y,e.y,e.y+e.h);return Math.hypot(me.x-cx,me.y-cy)<R()};
function hurt(a,g){if(G.dead||a<=0||mod('god',0)||(g&&mod('air',0)))return;if(me.sh>0){me.sh-=a;if(me.sh>=0)return;a=-me.sh;me.sh=0}me.hp-=a*mod('armor',1);G.hit=.15}
const alive=()=>[me,...Object.values(remotes)].filter(p=>p.hp>0);
function tgt(x,y){let b=null,bd=1e9;[...alive(),...G.ents.filter(e=>e.decoy)].forEach(p=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}});return b||me}
function edge(r){const s=(r()*4)|0,u=r();return s==0?{x:-20,y:u*H}:s==1?{x:W+20,y:u*H}:s==2?{x:u*W,y:-20}:{x:u*W,y:H+20}}
function pos(p,r){const t=tgt(W/2,H/2);if(p.at=='t'||(p.at=='m'&&r()<.6)){const j=p.j??100;return{x:cl(t.x+(r()-.5)*j*2,20,W-20),y:cl(t.y+(r()-.5)*j*2,20,H-20)}}return{x:30+r()*(W-60),y:30+r()*(H-60)}}
function add(e){e.age=-(e.delay||0);e.life=e.life||5;G.ents.push(e);return e}
function timer(dur,iv,fn,delay){let i=0;add({life:dur+.01,delay,nx:0,upd(){while(this.age>=this.nx&&this.nx<dur){fn(i++);this.nx+=iv}}})}
function txt(s,x,y,sz,a){c.font=sz+'px serif';c.textAlign='center';c.textBaseline='middle';c.globalAlpha=a??1;c.fillText(s,x,y);c.globalAlpha=1}

/* ---------- entity builders ---------- */
function proj(o){return add({life:6,r:6,dmg:10,col:'#fa0',proj:1,...o,upd(dt){if(this.g)this.vy+=this.g*dt;if(this.hom){const t=tgt(this.x,this.y),d=Math.hypot(t.x-this.x,t.y-this.y)||1,v=Math.hypot(this.vx,this.vy);this.vx+=((t.x-this.x)/d*v-this.vx)*this.hom*dt;this.vy+=((t.y-this.y)/d*v-this.vy)*this.hom*dt}this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.bn){if((this.x<0&&this.vx<0)||(this.x>W&&this.vx>0))this.vx*=-1;if((this.y<0&&this.vy<0)||(this.y>H&&this.vy>0))this.vy*=-1}
 if(this.x<-60||this.x>W+60||this.y<-60||this.y>H+60){this.dead=1;return}
 if(this.fr){for(const m of G.ents)if(m.mob&&!m.dead&&Math.hypot(m.x-this.x,m.y-this.y)<m.r+this.r){m.hp-=this.pd||1;this.dead=1;if(m.hp<=0)m.dead=1;break}}
 else if(wallHit(this)){this.dead=1;if(this.ex)boom(this.x,this.y,this.er||50,1)}else if(near(this.x,this.y,this.r)&&!inSt('house')){hurt(this.dmg);this.dead=1;if(this.ex)boom(this.x,this.y,this.er||50,1)}},
 draw(){if(this.em)txt(this.em,this.x,this.y,this.r*2.6);else if(this.ln){c.strokeStyle=this.col;c.lineWidth=3;c.beginPath();const l=Math.hypot(this.vx,this.vy);c.moveTo(this.x,this.y);c.lineTo(this.x-this.vx/l*20,this.y-this.vy/l*20);c.stroke()}else{c.fillStyle=this.col;c.beginPath();c.arc(this.x,this.y,this.r,0,7);c.fill()}}})}
function rect(p){if(p.water&&G.coldUntil>G.t){ice(p.fz,G.coldUntil-G.t);return}return add({x:p.x,y:p.y,w:p.w,h:p.h,life:p.life,delay:p.delay,p,upd(dt){const q=this.p,w=q.warn||0;if(this.age<w)return;if(q.water&&G.coldUntil>G.t){freeze(this);this.dead=1;return}
 if(q.path){const o=q.path(this.age-w);this.x=o.x;this.y=o.y}else{this.x+=(q.vx||0)*dt;this.y+=(q.vy||0)*dt}
 if(q.dps&&hitRect(this)&&!(q.water&&inSt('tower')))hurt(q.dps*dt,1)},
 draw(){const q=this.p;c.save();if(this.age<(q.warn||0)){const w=q.wr||[this.x,this.y,this.w,this.h];c.globalAlpha=.22+.15*Math.sin(this.age*16);c.fillStyle='#f33';c.fillRect(...w);c.globalAlpha=1;txt('⚠️',w[0]+w[2]/2,w[1]+Math.min(w[3],50)/2,20)}
 else{c.globalAlpha=q.al??.8;c.fillStyle=q.col;c.fillRect(this.x,this.y,this.w,this.h);c.globalAlpha=1;
  if(q.top){c.fillStyle=q.top;c.fillRect(this.x,this.y,this.w,5)}
  if(q.foam){c.fillStyle='#fff';const vx=q.vx||0;c.fillRect(vx>0?this.x+this.w-8:this.x,this.y,8,this.h)}}c.restore()}})}

/* ---------- effect templates (building blocks) ---------- */
const T={
 zones(p,x){for(let i=0;i<p.n;i++)add({delay:i*(p.gap??.2),life:p.warn+p.act,r:p.r,p,upd(dt){const q=this.p;if(!this.i){this.i=1;Object.assign(this,pos(q,x.r))}
  if(q.track&&this.age<q.warn*.75){const t=tgt(this.x,this.y),k=Math.min(1,dt*6);this.x+=(t.x-this.x)*k;this.y+=(t.y-this.y)*k}
  if(this.age>=q.warn){if(!this.f){this.f=1;if(q.fl)G.flash=.6;if(q.dmg&&q.r>=45)boom(this.x,this.y,this.r);if(q.dmg&&!q.once&&near(this.x,this.y,this.r))hurt(q.dmg,1)}
   if(q.dps&&near(this.x,this.y,this.r))hurt(q.dps*dt,1);
   if(q.once&&!this.h&&near(this.x,this.y,this.r)){this.h=1;hurt(q.dmg,1);this.age=this.life-.3}}},
  draw(){if(!this.i)return;const q=this.p,w=this.age<q.warn;c.fillStyle=q.col;c.strokeStyle=q.col;c.lineWidth=2;
   if(w){c.globalAlpha=.8;c.beginPath();c.arc(this.x,this.y,this.r,0,7);c.stroke();c.globalAlpha=.25+.2*Math.sin(this.age*14);c.beginPath();c.arc(this.x,this.y,this.r*Math.min(1,this.age/q.warn),0,7);c.fill()}
   else{c.globalAlpha=q.hide?.12:.55;c.beginPath();c.arc(this.x,this.y,this.r,0,7);c.fill()}c.globalAlpha=1;
   if(q.em)txt(q.em,this.x,this.y,this.r*1.1,w?.5:1)}}) },
 wave(p,x){const d=p.vert?1:(x.r()<.5?1:-1),sp=p.span,r=x.r(),th=p.th,L=(p.vert?H:W)+th*2;
  const o=p.vert?{x:r*(W-sp),y:-th,w:sp,h:th,vy:p.sp,wr:[r*(W-sp),0,sp,24]}:{x:d>0?-th:W,y:r*(H-sp),w:th,h:sp,vx:p.sp*d,wr:[d>0?0:W-24,r*(H-sp),24,sp]};
  const fz=p.vert?[o.x,H*.3,sp,200]:[W*.3,o.y,220,sp];rect({...p,...o,fz,life:p.warn+L/p.sp+.2})},
 flood(p){const tr=p.rise/p.sp,fl=p.rise/(p.sp*2);rect({...p,water:1,fz:[0,H-130,W,130],x:0,y:H,w:W,h:H,al:.55,top:'#9cf',warn:1.2,life:1.2+tr+p.hold+fl+.3,wr:[0,H-24,W,24],
  path:a=>({x:0,y:H-(a<tr?a*p.sp:a<tr+p.hold?p.rise:Math.max(0,p.rise-(a-tr-p.hold)*p.sp*2))})})},
 lasers(p,x){const t=tgt(0,0);for(let i=0;i<p.n;i++){const v=x.r()<.5,th=p.th,q=i%2?(v?x.r()*(W-th):x.r()*(H-th)):cl(v?t.x-th/2:t.y-th/2,0,v?W-th:H-th);
  rect({x:v?q:0,y:v?0:q,w:v?th:W,h:v?H:th,life:p.warn+.8,warn:p.warn,delay:i*p.gap,dps:p.dps,col:'#f0f',al:.9})}},
 shoot(p,x){const r=x.r;timer(p.dur,p.iv,()=>{for(let k=0;k<(p.n||1);k++){let sx,sy,a;
  if(p.src=='top'){sx=r()*W;sy=-10;a=Math.PI/2+(r()-.5)*.3}else{const e=edge(r),t=tgt(W/2,H/2);sx=e.x;sy=e.y;a=Math.atan2(t.y-sy,t.x-sx)+(r()-.5)*(p.spread||.2)}
  proj({x:sx,y:sy,vx:Math.cos(a)*p.sp,vy:Math.sin(a)*p.sp,r:p.r,dmg:p.dmg,col:p.col,em:p.em,ln:p.ln,bn:p.bn,hom:p.hom,ex:p.ex,life:p.life||6})}})},
 mobs(p,x){const r=x.r;for(let i=0;i<p.n;i++){const s=edge(r);add({mob:1,delay:i*(p.gap||.4),life:p.dur,x:s.x,y:s.y,hp:p.hp||1,r:p.r,em:p.em,cd:1,
  upd(dt){if(mod('freeze',0))return;const t=tgt(this.x,this.y),d=Math.hypot(t.x-this.x,t.y-this.y)||1;this.x+=(t.x-this.x)/d*p.sp*dt;this.y+=(t.y-this.y)/d*p.sp*dt;
   if(near(this.x,this.y,this.r))hurt(p.dmg*dt)},draw(){txt(this.em,this.x,this.y,this.r*2.2)}})}},
 pull(p,x){const r=x.r;add({x:p.at=='c'?W/2:80+r()*(W-160),y:p.at=='c'?H/2:60+r()*(H-120),r:p.r,life:p.dur,tx:0,ty:0,
  upd(dt){if(p.mv){if(!this.tx||Math.hypot(this.tx-this.x,this.ty-this.y)<20){this.tx=60+r()*(W-120);this.ty=60+r()*(H-120)}const d=Math.hypot(this.tx-this.x,this.ty-this.y)||1;this.x+=(this.tx-this.x)/d*95*dt;this.y+=(this.ty-this.y)/d*95*dt}
   const dx=this.x-me.x,dy=this.y-me.y,d=Math.hypot(dx,dy)||1;if(p.fl&&!G.dead){this.cc=Math.max(0,(this.cc||0)-dt);if(this.cg>0){this.cg-=dt;const a=Math.atan2(me.y-this.y,me.x-this.x)+9*dt,rr=Math.max(16,Math.hypot(me.x-this.x,me.y-this.y)*.96);me.x=this.x+Math.cos(a)*rr;me.y=this.y+Math.sin(a)*rr;me.vx=me.vy=0;if(this.cg<=0){const o=a+.5;me.vx=Math.cos(o)*1800;me.vy=Math.sin(o)*1800;hurt(14,1);this.cc=4}return}if(this.cc>0)return;if(d<this.r+R()+4)this.cg=1.1}
   if(d<p.range&&!G.dead){const f=p.f*(1-d/p.range),s=p.sw||0;me.x+=(dx/d-s*dy/d)*f*dt;me.y+=(dy/d+s*dx/d)*f*dt}
   if(near(this.x,this.y,this.r))hurt(p.dps*dt,1)},
  draw(){c.strokeStyle=p.col;c.lineWidth=3;for(let i=0;i<5;i++){c.globalAlpha=.7-i*.12;c.beginPath();c.arc(this.x,this.y,this.r*(.5+i*.5)+Math.sin(G.t*6+i)*4,G.t*(3+i),G.t*(3+i)+4.2);c.stroke()}c.globalAlpha=1;c.fillStyle='#000';c.beginPath();c.arc(this.x,this.y,this.r*.6,0,7);c.fill();if(p.em)txt(p.em,this.x,this.y,this.r*2)}})},
 ring(p){add({x:p.at=='c'?W/2:me.x,y:p.at=='c'?H/2:me.y,life:p.max/p.sp+.1,rad:0,upd(dt){const rad=this.rad=this.age*p.sp;if(!p.fr&&!this.h&&!G.dead&&Math.abs(Math.hypot(me.x-this.x,me.y-this.y)-rad)<p.th/2+R()){this.h=1;hurt(p.dmg,1)}
  for(const e of G.ents)if(p.fr&&((e.proj&&!e.fr)||e.mob)){const d=Math.hypot(e.x-this.x,e.y-this.y)||1;if(Math.abs(d-rad)<p.th+e.r){if(e.mob){e.x+=(e.x-this.x)/d*500*dt;e.y+=(e.y-this.y)/d*500*dt}else e.dead=1}}},
  draw(){c.strokeStyle=p.col;c.lineWidth=p.th;c.globalAlpha=.7;c.beginPath();c.arc(this.x,this.y,this.rad,0,7);c.stroke();c.globalAlpha=1}})},
 pick(p,x){const r=x.r;for(let i=0;i<p.n;i++)add({pick:1,life:p.dur,r:12,x:p.near?cl(me.x+(r()-.5)*180,30,W-30):30+r()*(W-60),y:p.near?cl(me.y+(r()-.5)*180,30,H-30):30+r()*(H-60),
  upd(dt){if(mod('magnet',0)){const d=Math.hypot(me.x-this.x,me.y-this.y)||1;if(d<380){this.x+=(me.x-this.x)/d*260*dt;this.y+=(me.y-this.y)/d*260*dt}}
   if(!G.dead&&near(this.x,this.y,this.r)){me.hp=Math.min(100,me.hp+(p.heal||0));me.sh+=p.sh||0;this.dead=1}},draw(){txt(p.em,this.x,this.y+Math.sin(G.t*5+this.x)*3,24)}})},
 turret(p){add({x:me.x,y:me.y,life:p.dur,cd:0,upd(dt){this.cd-=dt;if(this.cd>0)return;let b=null,bd=1e9;for(const m of G.ents)if(m.mob&&!m.dead&&m.age>0){const d=Math.hypot(m.x-this.x,m.y-this.y);if(d<bd){bd=d;b=m}}
   if(b){this.cd=p.iv;const a=Math.atan2(b.y-this.y,b.x-this.x);proj({fr:1,x:this.x,y:this.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,r:5,col:'#6f6',ln:1,life:2,dmg:0})}},draw(){txt('🔫',this.x,this.y,26)}})},
 decoy(p){add({decoy:1,x:me.x,y:me.y,life:p.dur,draw(){c.globalAlpha=.6;c.fillStyle='#7cf';c.beginPath();c.arc(this.x,this.y,12,0,7);c.fill();c.globalAlpha=1;txt('🎭',this.x,this.y,16)}})},
 fall(p,x){timer(p.dur,1/p.rate,()=>{const col=p.cols?p.cols[(Math.random()*p.cols.length)|0]:p.col;G.parts.push({x:Math.random()*(W+200)-100,y:p.vy<0?H+10:-10,vx:p.vx||0,vy:p.vy*(.8+Math.random()*.4),col,sh:p.sh,sz:p.sz,em:p.em,rot:Math.random()*6})})},
 mod(p){for(const k in p.m)setMod(k,p.m[k],p.dur)},
 heal(p){me.hp=Math.min(100,me.hp+p.hp)},shield(p){me.sh+=p.sh},
 dash(){const d=G.dir||{x:1,y:0};me.vx+=d.x*1500;me.vy+=d.y*1500;setMod('god',1,.4)},
 flash(){G.flash=.8},strobe(p){timer(p.dur,p.iv,()=>{G.flash=.5})},tp(){me.x=60+Math.random()*(W-120);me.y=60+Math.random()*(H-120);me.vx=me.vy=0;G.flash=.5}
};

/* ---------- weapons, climate, ice ---------- */
const WP=[
{n:'Pistol',em:'🔫',t:'gun',iv:.4,dmg:1,sp:620,rg:420},{n:'Shotgun',em:'🔫',t:'gun',iv:.9,dmg:1,sp:560,rg:260,np:6,spr:.5},
{n:'SMG',em:'🔫',t:'gun',iv:.12,dmg:.5,sp:640,rg:380,spr:.12},{n:'Rifle',em:'🔫',t:'gun',iv:.6,dmg:2,sp:900,rg:600},
{n:'Revolver',em:'🔫',t:'gun',iv:.7,dmg:2.5,sp:700,rg:450},{n:'Sniper',em:'🎯',t:'gun',iv:1.3,dmg:5,sp:1300,rg:800},

const norm=s=>s.toLowerCase().replace(/[^a-z]/g,''),INDEX=[];
function buildIndex(){IDEAS.forEach((d,i)=>d.syn.forEach(s=>{const k=norm(s);if(k)INDEX.push({k,i})}))}
function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=q}return p[n]}
function find(w){w=norm(w);if(!w)return null;let e=INDEX.find(e=>e.k==w);if(e)return e.i;
 let best=null,bs=0;if(w.length>=3)for(const e of INDEX)if(e.k.length>=3&&(e.k.includes(w)||w.includes(e.k))){const s=Math.min(w.length,e.k.length)/Math.max(w.length,e.k.length);if(s>bs){bs=s;best=e}}
 if(best)return best.i;let bd=99;for(const e of INDEX){const d=lev(w,e.k);if(d<bd){bd=d;best=e}}return best.i}

 if(G.mp&&G.holder===myId&&!G.dead&&G.t-G.hold0>25)passHolder();if(!G.dead&&me.hp<=0){me.hp=0;G.dead=1;if(G.mp&&G.holder===myId)passHolder();toast('You died'+(conns.length?' — spectating':''),'d')}
 if(conns.length){G.sn-=dt;if(G.sn<=0){G.sn=.066;send({t:'p',id:myId,x:me.x,y:me.y,hp:me.hp,sh:me.sh})}}
 const al=alive();if(!G.over&&((!G.mp&&G.dead)||(G.mp&&al.length<=1))){G.over=1;$('ovt').textContent=G.mp?(al[0]===me?'🏆 You win!':al.length?'🏆 '+al[0].name+' wins':'💀 Nobody survived'):'💀 Game over';$('sv').textContent='Survived: '+G.t.toFixed(1)+'s';$('over').classList.remove('hide')}}
const COLS=['#6c5ce7','#00cec9','#fdcb6e','#e17055'];
function drawP(p,col,isMe){const sz=isMe?mod('size',1):1,r=p.r*sz;let y=p.y;if(isMe){if(mod('air',0))y-=16;if(mod('bob',0))y+=Math.sin(G.t*4)*6}
 c.globalAlpha=p.hp<=0?.3:1;c.fillStyle='#0006';c.beginPath();c.ellipse(p.x,p.y+r*.8,r,r*.4,0,0,7);c.fill();
 c.fillStyle=col;c.beginPath();c.arc(p.x,y,r,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(p.x-r*.35,y-r*.2,r*.22,0,7);c.arc(p.x+r*.35,y-r*.2,r*.22,0,7);c.fill();
 if(p.sh>0){c.strokeStyle='#6cf';c.lineWidth=3;c.beginPath();c.arc(p.x,y,r+5,0,7);c.stroke()}
 if(isMe&&me.wp)txt(me.wp.em,p.x+r+6,y+2,18);if(isMe&&mod('hb',1)<1){c.fillStyle='#f33';c.beginPath();c.arc(p.x,y,R(),0,7);c.fill()}
 if(isMe&&G.hit>0){c.strokeStyle='#f33';c.lineWidth=3;c.beginPath();c.arc(p.x,y,r+3,0,7);c.stroke()}
 c.globalAlpha=1;c.fillStyle='#fff';c.font='11px system-ui';c.textAlign='center';c.fillText(p.name,p.x,y-r-8)}
let lastF='';
function draw(){c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#05050c';c.fillRect(0,0,cv.width,cv.height);c.setTransform(dpr*S,0,0,dpr*S,dpr*OX,dpr*OY);
 c.save();c.translate(W/2,H/2);const sp=mod('spin',0);c.rotate(G.t*sp+mod('rot',0));if(mod('mirror',0))c.scale(-1,1);const sk=mod('shake',0);c.translate(-W/2+(Math.random()-.5)*sk,-H/2+(Math.random()-.5)*sk);
 c.beginPath();c.rect(0,0,W,H);c.clip();
 c.fillStyle=mod('disco',0)?`hsl(${(G.t*260)%360},55%,22%)`:'#1b1d33';c.fillRect(0,0,W,H);
 c.strokeStyle='#ffffff0d';c.lineWidth=1;c.beginPath();for(let x=0;x<=W;x+=50){c.moveTo(x,0);c.lineTo(x,H)}for(let y=0;y<=H;y+=50){c.moveTo(0,y);c.lineTo(W,y)}c.stroke();
 for(let i=0;i<160;i++){const t=G.tile[i];if(!t)continue;const X=(i%16)*50,Y=((i/16)|0)*50;if(t==2){c.fillStyle='#1d63c4';c.fillRect(X,Y,50,50);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(X,Y+((G.t*30+i*7)%46),50,3)}else{c.fillStyle=(G.t*8|0)%2?'#5a1f2a':'#2a1218';c.fillRect(X,Y,50,50)}}
 for(const e of G.ents)if(e.age>=0&&e.draw)e.draw();
 for(const k in remotes)drawP(remotes[k],remotes[k].col,0);drawP(me,'#ff7675',1);
 for(const p of G.parts){c.fillStyle=c.strokeStyle=p.col;if(p.em)txt(p.em,p.x,p.y,p.sz);else if(p.sh=='l'){c.lineWidth=1.5;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+p.vx*.02,p.y+p.vy*.02);c.stroke()}else if(p.sh=='d'){c.beginPath();c.arc(p.x,p.y,p.sz,0,7);c.fill()}else c.fillRect(p.x,p.y,p.sz,p.sz)}
 if(mod('fog',0)){const g=c.createRadialGradient(me.x,me.y,60,me.x,me.y,260);g.addColorStop(0,'rgba(220,225,235,0)');g.addColorStop(1,'rgba(220,225,235,.88)');c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(mod('dark',0)){const g=c.createRadialGradient(me.x,me.y,40,me.x,me.y,170);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.96)');c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(G.flash>0){c.fillStyle='rgba(255,255,255,'+G.flash+')';c.fillRect(0,0,W,H)}
 c.strokeStyle='#6c5ce7';c.lineWidth=4;c.strokeRect(0,0,W,H);c.restore();
 const f=[mod('invert',0)?'invert(1)':'',mod('hue',0)?`hue-rotate(${(G.t*120)%360|0}deg) saturate(2)`:'',mod('gray',0)?'grayscale(1)':'',mod('blur',0)?'blur(3px)':''].join(' ').trim();if(f!=lastF){cv.style.filter=f;lastF=f}}
let tt;function toast(s,cat){const e=$('toast');e.textContent=s;e.style.color=cat=='d'?'#ff7675':cat=='h'?'#55efc4':'#ffeaa7';e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function hud(){$('hpf').style.width=me.hp+'%';$('hpf').style.background=me.hp>50?'#4f6':me.hp>25?'#fc3':'#f44';$('tm').textContent=G.t.toFixed(0)+'s'+(me.sh>0?' 🛡'+Math.ceil(me.sh):'')+(me.wp?' '+me.wp.em+Math.ceil(me.wp.until-G.t)+'s':'');

const nm=i=>IDEAS[i].name;

function fire(){const w=inp.value.trim();if(!running||!w||(G.mp&&G.holder!==myId))return;if(G.t<G.cd){toast('Cooldown…');return}
 const i=find(w);if(i==null)return;G.cd=G.t+1.5;const seed=(Math.random()*1e9)|0;inp.value='';
 const nx=G.mp?nextHolder(0):myId;launch(i,seed);toast(`Idea ${w} triggered: ${nm(i)}!`,IDEAS[i].cat);send({t:'i',id:myId,i,w,seed,nx});if(nx!==G.holder)setHolder(nx)}
$('go').onclick=fire;inp.addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();fire()}});

addEventListener('keydown',e=>{if(document.activeElement==inp)return;keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
const jz=$('joy'),kn=$('knob');let jid=null;
function jmove(e){const b=jz.getBoundingClientRect(),rad=b.width/2;let dx=e.clientX-(b.left+rad),dy=e.clientY-(b.top+rad);const d=Math.hypot(dx,dy);if(d>rad){dx*=rad/d;dy*=rad/d}joy.x=dx/rad;joy.y=dy/rad;kn.style.transform=`translate(${dx}px,${dy}px)`}
jz.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;jz.setPointerCapture(jid);jmove(e)});
jz.addEventListener('pointermove',e=>{if(e.pointerId==jid)jmove(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;joy.x=joy.y=0;kn.style.transform=''}};jz.addEventListener('pointerup',jend);jz.addEventListener('pointercancel',jend);

/* ---------- PeerJS multiplayer ---------- */
const send=(o,ex)=>conns.forEach(cn=>{if(cn.open&&cn!==ex)cn.send(o)});
const msg=s=>$('msg').textContent=s||'',show=id=>['m0','m1','m2'].forEach(k=>$(k).classList.toggle('hide',k!=id));
const rem=id=>remotes[id]||(remotes[id]={x:W/2,y:H/2,hp:100,sh:0,r:12,name:'P'+(Object.keys(remotes).length+2),col:COLS[Object.keys(remotes).length%4]});
function setup(cn){
 cn.on('open',()=>{if(!conns.includes(cn))conns.push(cn);rem(cn.peer);msg(isHost?'Friend connected!':'Connected! Waiting for host…');$('st').disabled=false;if(running&&isHost)cn.send({t:'start',h:G.holder})});
 cn.on('data',d=>{if(!d||typeof d!='object')return;const id=isHost?cn.peer:(d.id||cn.peer);d.id=id;
  if(d.t=='start'){startGame(typeof d.h=='string'?d.h:undefined);return}
  if(d.t=='p'){const q=rem(id);q.x=+d.x||0;q.y=+d.y||0;q.hp=+d.hp||0;q.sh=+d.sh||0}
  if(d.t=='i'&&running&&Number.isInteger(d.i)&&IDEAS[d.i]){launch(d.i,d.seed|0);toast(`${rem(id).name}: Idea ${String(d.w).slice(0,24)} triggered: ${nm(d.i)}!`,IDEAS[d.i].cat);if(order().includes(d.nx)&&d.nx!==G.holder)setHolder(d.nx)}
  if(d.t=='h'&&running&&order().includes(d.nx))setHolder(d.nx);if(d.t=='x'&&G.drops&&G.drops[String(d.key)])G.drops[String(d.key)].dead=1;if(isHost)send(d,cn)});
 const gone=()=>{const wasH=running&&G.holder===cn.peer;conns=conns.filter(x=>x!==cn);delete remotes[cn.peer];if(wasH&&isHost){const nx=nextHolder(1);send({t:'h',id:myId,nx});setHolder(nx)}if(running)toast('A player left')};cn.on('close',gone);cn.on('error',gone)}
function reset(){try{peer&&peer.destroy()}catch(e){}peer=null;conns=[];remotes={};isHost=false;myId='me';msg('');show('m0')}
function host(){if(typeof Peer=='undefined'){msg('PeerJS failed to load (are you online?)');return}isHost=true;const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=[0,0,0,0].map(()=>ch[(Math.random()*ch.length)|0]).join('');
 peer=new Peer('syi-'+code);peer.on('open',id=>{myId=id;$('rc').textContent=code;show('m2');$('st').classList.remove('hide');$('st').disabled=true;msg('Waiting for a friend…')});
 peer.on('connection',setup);peer.on('error',e=>{if(e.type=='unavailable-id'){try{peer.destroy()}catch(_){}host()}else msg('Error: '+e.type)})}
function join(){if(typeof Peer=='undefined'){msg('PeerJS failed to load (are you online?)');return}const code=$('code').value.trim().toUpperCase();if(code.length<4){msg('Enter 4-char code');return}isHost=false;msg('Connecting…');
 peer=new Peer();peer.on('open',id=>{myId=id;const cn=peer.connect('syi-'+code,{reliable:true});setup(cn);$('rc').textContent=code;$('st').classList.add('hide');show('m2')});peer.on('error',e=>msg('Error: '+e.type+' — check the code'))}
$('bs').onclick=()=>{reset();startGame()};$('bm').onclick=()=>{show('m1');msg('')};$('bh').onclick=host;$('bj').onclick=join;
$('st').onclick=()=>{const o=order(),h=o[(Math.random()*o.length)|0];send({t:'start',h});startGame(h)};document.querySelectorAll('.bk').forEach(b=>b.onclick=reset);
